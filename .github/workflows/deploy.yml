name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy (tag or branch)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/taskflow

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployment.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download task definitions
        run: |
          aws ecs describe-task-definition \
            --task-definition taskflow-api-${{ inputs.environment }} \
            --query taskDefinition > api-task-def.json
          
          aws ecs describe-task-definition \
            --task-definition taskflow-worker-${{ inputs.environment }} \
            --query taskDefinition > worker-task-def.json

      - name: Update API task definition
        id: api-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task-def.json
          container-name: taskflow-api
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ inputs.version }}

      - name: Deploy API to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.api-task-def.outputs.task-definition }}
          service: taskflow-api-${{ inputs.environment }}
          cluster: taskflow-${{ inputs.environment }}
          wait-for-service-stability: true

      - name: Update Worker task definition
        id: worker-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-task-def.json
          container-name: taskflow-worker
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker:${{ inputs.version }}

      - name: Deploy Worker to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.worker-task-def.outputs.task-definition }}
          service: taskflow-worker-${{ inputs.environment }}
          cluster: taskflow-${{ inputs.environment }}
          wait-for-service-stability: true

      - name: Update Dashboard S3 and CloudFront
        run: |
          # Download dashboard build
          aws s3 sync s3://taskflow-dashboard-builds/${{ inputs.version }} ./dashboard-build
          
          # Upload to S3
          aws s3 sync ./dashboard-build s3://taskflow-dashboard-${{ inputs.environment }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable"
          
          # Invalidate CloudFront
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Run database migrations
        run: |
          aws ecs run-task \
            --cluster taskflow-${{ inputs.environment }} \
            --task-definition taskflow-migration-${{ inputs.environment }} \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_IDS }}],securityGroups=[${{ secrets.SECURITY_GROUP_ID }}],assignPublicIp=ENABLED}" \
            --wait

      - name: Health check
        id: health-check
        run: |
          API_URL="${{ secrets.API_URL }}"
          MAX_RETRIES=30
          RETRY_INTERVAL=10
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES"
            if curl -f "$API_URL/health" > /dev/null 2>&1; then
              echo "Health check passed"
              echo "url=$API_URL" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep $RETRY_INTERVAL
          done
          
          echo "Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Smoke tests
        run: |
          API_URL="${{ secrets.API_URL }}"
          
          # Test job submission
          RESPONSE=$(curl -s -X POST "$API_URL/jobs" \
            -H "X-API-Key: ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"type":"test","payload":{"test":true}}')
          
          JOB_ID=$(echo $RESPONSE | jq -r '.id')
          echo "Created test job: $JOB_ID"
          
          # Test job retrieval
          curl -f "$API_URL/jobs/$JOB_ID" \
            -H "X-API-Key: ${{ secrets.API_KEY }}" || exit 1
          
          echo "Smoke tests passed"

      - name: Notify deployment success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Deployment to ${{ inputs.environment }} succeeded",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Successful* :rocket:\n*Environment:* ${{ inputs.environment }}\n*Version:* ${{ inputs.version }}\n*Actor:* ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Notify deployment failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Deployment to ${{ inputs.environment }} failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed* :x:\n*Environment:* ${{ inputs.environment }}\n*Version:* ${{ inputs.version }}\n*Actor:* ${{ github.actor }}"
                  }
                }
              ]
            }

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rollback ECS services
        run: |
          # Get previous task definition revisions
          PREVIOUS_API_REVISION=$(aws ecs describe-services \
            --cluster taskflow-${{ inputs.environment }} \
            --services taskflow-api-${{ inputs.environment }} \
            --query 'services[0].deployments[1].taskDefinition' \
            --output text)
          
          PREVIOUS_WORKER_REVISION=$(aws ecs describe-services \
            --cluster taskflow-${{ inputs.environment }} \
            --services taskflow-worker-${{ inputs.environment }} \
            --query 'services[0].deployments[1].taskDefinition' \
            --output text)
          
          # Rollback to previous revisions
          if [ -n "$PREVIOUS_API_REVISION" ]; then
            aws ecs update-service \
              --cluster taskflow-${{ inputs.environment }} \
              --service taskflow-api-${{ inputs.environment }} \
              --task-definition $PREVIOUS_API_REVISION
          fi
          
          if [ -n "$PREVIOUS_WORKER_REVISION" ]; then
            aws ecs update-service \
              --cluster taskflow-${{ inputs.environment }} \
              --service taskflow-worker-${{ inputs.environment }} \
              --task-definition $PREVIOUS_WORKER_REVISION
          fi

      - name: Notify rollback
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "⚠️ Rollback initiated for ${{ inputs.environment }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Automatic Rollback* :warning:\n*Environment:* ${{ inputs.environment }}\n*Reason:* Deployment failure detected"
                  }
                }
              ]
            }
