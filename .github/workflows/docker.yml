name: Docker Build & Push

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/taskflow

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker, dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 90

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        service: [api, worker, dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: trivy-${{ matrix.service }}

  # Brings up the production-style stack from docker-compose.prod.yml, runs one
  # job end to end through the dashboard's nginx proxy and tears it down.
  docker-compose-test:
    name: Test production compose stack
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      COMPOSE: docker compose -p taskflow-ci --env-file .env.ci -f docker-compose.prod.yml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create env file
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "API_KEY_HASH_SALT=$(openssl rand -hex 16)"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "API_REPLICAS=1"
            echo "WORKER_REPLICAS=1"
          } > .env.ci
      - name: Start stack
        run: $COMPOSE up -d --build --wait --wait-timeout 300
      - name: Create API key
        run: |
          # The key is the first stdout line; log lines follow it.
          $COMPOSE run --rm --no-deps -T migrate \
            node node_modules/@taskflow/database/dist/create-api-key.js --role admin --name ci \
            > .ci-key-output 2>/dev/null
          head -n 1 .ci-key-output | tr -d '\r\n' > .ci-api-key
          rm .ci-key-output
          echo "::add-mask::$(cat .ci-api-key)"
      - name: Run a job end to end
        run: |
          KEY="$(cat .ci-api-key)"
          ID=$(curl -fsS -X POST http://localhost:8080/api/v1/jobs \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"type":"process-data","payload":{"operation":"transform","data":[{"a":1}]},"queue":"default"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          for _ in $(seq 1 30); do
            STATUS=$(curl -fsS "http://localhost:8080/api/v1/jobs/$ID" -H "X-API-Key: $KEY" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["status"])')
            echo "job $ID: $STATUS"
            [ "$STATUS" = "SUCCEEDED" ] && exit 0
            sleep 2
          done
          echo "job did not reach SUCCEEDED" >&2
          exit 1
      - name: Show logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Cleanup
        if: always()
        run: $COMPOSE down -v
  status:
    name: Docker Pipeline Status
    runs-on: ubuntu-latest
    needs: [build-and-push, scan, docker-compose-test]
    if: always()
    steps:
      - name: Check pipeline status
        run: |
          if [ "${{ needs.build-and-push.result }}" != "success" ] || \
             [ "${{ needs.scan.result }}" != "success" ] || \
             [ "${{ needs.docker-compose-test.result }}" != "success" ]; then
            echo "Docker pipeline failed"
            exit 1
          fi
          echo "Docker pipeline passed"
