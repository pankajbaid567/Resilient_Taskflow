services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow_test
      POSTGRES_PASSWORD: taskflow_test
      POSTGRES_DB: taskflow_test
    ports:
      - '55439:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../packages/database/migrations:/migrations:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U taskflow_test -d taskflow_test',
        ]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--save', '']
    ports:
      - '56389:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
