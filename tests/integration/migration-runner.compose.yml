services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow_test
      POSTGRES_PASSWORD: taskflow_test
      POSTGRES_DB: taskflow_test
    ports:
      - '127.0.0.1:55449:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U taskflow_test -d taskflow_test',
        ]
      interval: 1s
      timeout: 3s
      retries: 30
