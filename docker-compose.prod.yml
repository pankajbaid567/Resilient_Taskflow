# Production-style stack: Postgres, Redis, one-shot migrations, API (xN),
# workers (xN), dashboard (nginx), Prometheus and Grafana.
#
#   cp .env.production.example .env.prod.local     # then fill in the secrets
#   docker compose -p taskflow-prod --env-file .env.prod.local \
#     -f docker-compose.prod.yml up -d --build
#
# Only the dashboard (which proxies /api and /health to the API), Prometheus
# and Grafana publish host ports. Postgres, Redis, the API and the workers
# stay on the internal network. Host-port defaults avoid the development
# stack in docker-compose.yml, so both can run at once (use a different -p).

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-taskflow}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (32+ chars)}
  API_KEY_HASH_SALT: ${API_KEY_HASH_SALT:?API_KEY_HASH_SALT must be set (16+ chars)}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [taskflow]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Redis Streams carry the jobs, so Redis must never evict keys under memory
  # pressure (allkeys-lru would silently drop queued work). With noeviction a
  # full Redis rejects writes instead, which the API surfaces as an error.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [taskflow]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # One-shot: applies pending SQL migrations (advisory-locked, so safe to
  # re-run), seeds the default queues and exits. API and workers start only after it succeeds.
  migrate:
    # Same image as the worker (built by the worker service; building it twice
    # in one `up` races on the image tag).
    image: taskflow-worker:${VERSION:-latest}
    pull_policy: never
    restart: 'no'
    environment: *app-env
    # Seeding only inserts the default queues that are missing (ON CONFLICT DO
    # NOTHING); it never changes existing rows.
    command:
      - sh
      - -c
      - node node_modules/@taskflow/database/dist/migrate.js && node node_modules/@taskflow/database/dist/seed.js
    depends_on:
      postgres:
        condition: service_healthy
    networks: [taskflow]
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: taskflow-api:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: 3000
      API_SHUTDOWN_TIMEOUT_MS: 30000
      # Requests arrive through the dashboard's nginx on this network.
      API_TRUSTED_PROXIES: 172.28.0.0/16
      RATE_LIMIT_JOB_SUBMISSION_PER_MIN: ${RATE_LIMIT_JOB_SUBMISSION_PER_MIN:-50}
      RATE_LIMIT_MUTATION_PER_MIN: ${RATE_LIMIT_MUTATION_PER_MIN:-50}
      RATE_LIMIT_READ_PER_MIN: ${RATE_LIMIT_READ_PER_MIN:-200}
      RATE_LIMIT_METRICS_PER_MIN: ${RATE_LIMIT_METRICS_PER_MIN:-1000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [taskflow]
    stop_grace_period: 40s
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: taskflow-worker:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_QUEUES: ${WORKER_QUEUES:-default,email,critical,low}
      # /metrics has no authentication: it listens on all interfaces of the
      # internal network only, and the port is not published.
      WORKER_METRICS_PORT: 9464
      WORKER_METRICS_HOST: 0.0.0.0
      DISPATCH_MAX_IN_FLIGHT_PER_QUEUE: ${DISPATCH_MAX_IN_FLIGHT_PER_QUEUE:-200}
      RETENTION_ENABLED: ${RETENTION_ENABLED:-true}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-3600000}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-500}
      RETENTION_JOBS_DAYS: ${RETENTION_JOBS_DAYS:-30}
      RETENTION_EVENTS_DAYS: ${RETENTION_EVENTS_DAYS:-14}
      RETENTION_ATTEMPTS_DAYS: ${RETENTION_ATTEMPTS_DAYS:-14}
      RETENTION_DEAD_LETTERS_DAYS: ${RETENTION_DEAD_LETTERS_DAYS:-30}
      RETENTION_DELIVERIES_DAYS: ${RETENTION_DELIVERIES_DAYS:-7}
      RETENTION_WORKERS_DAYS: ${RETENTION_WORKERS_DAYS:-7}
      RETENTION_IDEMPOTENCY_KEYS_HOURS: ${RETENTION_IDEMPOTENCY_KEYS_HOURS:-24}
      RETENTION_AUDIT_LOGS_DAYS: ${RETENTION_AUDIT_LOGS_DAYS:-90}
      RETENTION_REDIS_STREAM_MAX_LEN: ${RETENTION_REDIS_STREAM_MAX_LEN:-100000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [taskflow]
    # Lets in-flight jobs drain, then leases are released (see the shutdown ADR).
    stop_grace_period: 70s
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        # Empty: the SPA calls /api/v1 on its own origin and nginx proxies it.
        VITE_API_URL: ${VITE_API_URL:-}
    image: taskflow-dashboard:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - '${DASHBOARD_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    networks: [taskflow]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - '${PROMETHEUS_PORT:-9092}:9090'
    volumes:
      - ./infrastructure/prometheus/prometheus.stack.yml:/etc/prometheus/prometheus.yml:ro
      # Holds stack_api_key: an admin API key for this stack's database (see
      # docs/observability.md). GET /metrics on the API is admin-only.
      - ./infrastructure/prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:9090/-/healthy']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [taskflow]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - '${GRAFANA_PORT:-3003}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [taskflow]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  taskflow:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
